name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install project with all extras + test tools
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q -o addopts=""

  core-install:
    # The default `pip install caretaker-mcp` has no heavy extras: make sure the
    # package still imports, starts its CLI and builds without them.
    name: core install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Build wheel
        run: uv build --wheel -o dist
      - name: Install wheel without extras
        run: |
          uv venv core-venv -p 3.12
          VIRTUAL_ENV=core-venv uv pip install dist/*.whl
      - name: Smoke test
        run: |
          core-venv/bin/caretaker --help
          core-venv/bin/python -c "import caretaker, caretaker.dashboard, caretaker.mcp_server.server; print('ok', caretaker.__version__)"
